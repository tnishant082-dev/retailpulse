[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "RetailPulse: churn, CLV and demand forecasting on UCI Online Retail II."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.0.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "requests>=2.32.0",
  "lightgbm>=4.0.0",
  "lifetimes>=0.11.0",
  "mlflow>=2.0.0",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["retailpulse"]
